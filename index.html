<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eef8">
<title>세종영재 급식</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#e9eef8; --ink:#17203a; --ink-soft:#5a6582; --ink-faint:#8c95ad;
  --blob1:#a9c6ff; --blob2:#d3bfff; --blob3:#a6e6db;
  --glass-top:rgba(255,255,255,.62); --glass-bot:rgba(255,255,255,.28);
  --rim:rgba(255,255,255,.75); --rim-low:rgba(255,255,255,.25);
  --shadow:rgba(38,56,110,.14); --spec:rgba(255,255,255,.7);
  --accent:#3b5bdb; --chip-bg:rgba(59,91,219,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1022; --ink:#e8edf9; --ink-soft:#a3aeca; --ink-faint:#6c7795;
    --blob1:#2c46a0; --blob2:#4e2f86; --blob3:#11605d;
    --glass-top:rgba(255,255,255,.13); --glass-bot:rgba(255,255,255,.04);
    --rim:rgba(255,255,255,.28); --rim-low:rgba(255,255,255,.06);
    --shadow:rgba(0,0,0,.45); --spec:rgba(255,255,255,.22);
    --accent:#8fa8ff; --chip-bg:rgba(143,168,255,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1022; --ink:#e8edf9; --ink-soft:#a3aeca; --ink-faint:#6c7795;
  --blob1:#2c46a0; --blob2:#4e2f86; --blob3:#11605d;
  --glass-top:rgba(255,255,255,.13); --glass-bot:rgba(255,255,255,.04);
  --rim:rgba(255,255,255,.28); --rim-low:rgba(255,255,255,.06);
  --shadow:rgba(0,0,0,.45); --spec:rgba(255,255,255,.22);
  --accent:#8fa8ff; --chip-bg:rgba(143,168,255,.16);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
.theming *,.theming *::before,.theming *::after,.theming body{transition:none!important}
#veil{position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0}
button{transition:opacity .15s ease}
button:active{opacity:.6}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* 배경: 블러 필터·애니메이션 없이 그라데이션 한 장 (뒤의 유리 블러를 매 프레임 다시 계산하지 않게) */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 8% 4%,var(--blob1),transparent 70%),
    radial-gradient(55vmax 55vmax at 100% 45%,var(--blob2),transparent 70%),
    radial-gradient(55vmax 55vmax at 15% 105%,var(--blob3),transparent 70%),
    var(--bg);
  transform:translateZ(0)}

.app{position:relative;z-index:1;max-width:480px;height:100%;margin:0 auto;padding:14px 14px 12px;display:flex;flex-direction:column}

header{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 6px 14px}
.date-wrap{min-width:0}
#date{font-size:clamp(30px,9vw,38px);font-weight:750;letter-spacing:-.035em;line-height:1.05;margin:0;
  transition:opacity .35s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
#weekday{margin:6px 0 0;font-size:15px;font-weight:500;color:var(--ink-soft);letter-spacing:-.01em}
#weekday b{font-weight:650;color:var(--accent)}

.controls{display:flex;gap:6px;padding:5px;border-radius:999px;flex-shrink:0}
.controls button{
  appearance:none;border:0;background:transparent;color:var(--ink);
  height:36px;min-width:36px;padding:0 10px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;
  display:grid;place-items:center;cursor:pointer;
  transition:background .25s ease,opacity .15s ease,transform .35s cubic-bezier(.34,1.56,.64,1);
}
.controls button:hover{background:var(--rim-low)}
.controls button:active{transform:scale(.88)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls svg{width:18px;height:18px}
#today[hidden]{display:none}

/* 리퀴드 글라스 */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(160deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
  border:1px solid var(--rim);
  box-shadow:
    inset 0 1.5px 0 var(--rim),
    inset 0 -1px 0 var(--rim-low),
    0 8px 24px -10px var(--shadow);
}
.refract .glass{backdrop-filter:url(#lens) blur(14px) saturate(170%)}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,30%) var(--my,0%),var(--spec),transparent 65%);
  opacity:calc(.55 + var(--glow,0) * .45);
}
/* 펜슬/커서를 따라 테두리에 맺히는 빛 */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:radial-gradient(150px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  opacity:var(--glow,0);
}
.glass:not(.lit)::after{display:none}

#stack{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
#stack.dragging{will-change:transform}
.meal{border-radius:28px;padding:17px 20px 0;
  flex:1 1 0;min-height:0;display:flex;flex-direction:column;contain:layout paint;
  transition:flex .55s cubic-bezier(.32,.72,0,1),transform .5s cubic-bezier(.34,1.56,.64,1),opacity .4s ease}
.meal[role="button"]{cursor:pointer;user-select:none;-webkit-user-select:none}
.meal[role="button"]:active{transform:scale(.985)}
.meal.mini{flex:0 0 56px}
.meal.tilting{transition:flex .55s cubic-bezier(.32,.72,0,1),opacity .4s ease;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.meal.now{box-shadow:inset 0 1.5px 0 var(--rim),inset 0 -1px 0 var(--rim-low),0 14px 32px -12px var(--shadow)}
.meal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.meal-head{flex:none;display:flex;align-items:center;gap:10px;height:22px;margin-bottom:10px}
.meal h2{flex:none;margin:0;font-size:15px;font-weight:650;color:var(--ink-soft);letter-spacing:-.01em}
.summary{flex:1;min-width:0;font-size:15px;font-weight:550;letter-spacing:-.02em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);
  transition:opacity .3s ease,transform .45s cubic-bezier(.32,.72,0,1)}
.meal.mini .summary{opacity:1;transform:none;transition-delay:.12s}
.chip{flex:none;margin-left:auto;font-size:12px;font-weight:650;color:var(--accent);background:var(--chip-bg);padding:4px 9px;border-radius:999px;
  animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.summary + .chip{margin-left:0}
@keyframes pop{from{transform:scale(.5);opacity:0}}

.content{flex:1;min-height:0;overflow:hidden;padding-bottom:16px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent calc(100% - 6px));
  mask-image:linear-gradient(#000 calc(100% - 34px),transparent calc(100% - 6px));
  transition:opacity .25s ease}
.meal.open .content{overflow-y:auto;-webkit-mask-image:none;mask-image:none;overscroll-behavior:contain}
.meal.mini .content{opacity:0}
.dishes{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.dishes li{font-size:16.5px;font-weight:520;line-height:1.48;letter-spacing:-.02em}
.dishes li:first-child{font-weight:650}
.note{margin:0;font-size:15px;line-height:1.55;color:var(--ink-faint)}
.note button{margin-top:10px;appearance:none;border:1px solid var(--rim);background:var(--chip-bg);color:var(--accent);
  font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.skel{height:15px;border-radius:8px;background:var(--rim-low);margin:9px 0;animation:shimmer 1.4s ease-in-out infinite}
.skel:nth-child(2){width:72%}.skel:nth-child(3){width:58%}.skel:nth-child(4){width:80%}
@keyframes shimmer{50%{opacity:.45}}


@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lens" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="sky" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="date-wrap">
      <h1 id="date">&nbsp;</h1>
      <p id="weekday">&nbsp;</p>
    </div>
    <nav class="controls glass" aria-label="날짜 이동">
      <button id="prev" aria-label="전날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="today" hidden>오늘</button>
      <button id="next" aria-label="다음날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button id="theme" aria-label="화면 테마 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </nav>
  </header>

  <main id="stack" aria-live="polite"></main>

</div>

<script>
/* ===== 설정 ===== */
const CFG = {
  KEY: "018f206ca7dd4733a968c746a0674013",                       // NEIS 인증키 (open.neis.go.kr에서 발급). 비워두면 샘플 모드로 요청
  OFFICE: "I10",                 // 세종특별자치시교육청
  SCHOOL_NAME: "세종과학예술영재학교",
  SCHOOL_CODE: "",               // 알고 있으면 넣기. 비워두면 학교명으로 자동 조회
  REFRACTION: false              // 크롬 계열 브라우저에서 유리 굴절 효과 사용
};
const MEALS = ["조식", "중식", "석식"];
const API = "https://open.neis.go.kr/hub/";

/* ===== 저장소 (실패해도 동작) ===== */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* ===== 테마 ===== */
const root = document.documentElement;
const savedTheme = store.get("theme");
if (savedTheme) root.dataset.theme = savedTheme;
let themeBusy = false;
const isDark = () => (root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
function syncThemeColor(){ document.querySelector('meta[name="theme-color"]').content = isDark() ? "#0a1022" : "#e9eef8"; }
syncThemeColor();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor);

const veil = document.createElement("div");
veil.id = "veil"; document.body.appendChild(veil);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

document.getElementById("theme").addEventListener("click", async () => {
  if (themeBusy) return;
  themeBusy = true;
  const next = isDark() ? "light" : "dark";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 1) 지금 배경색의 막을 서서히 덮고
  veil.style.background = getComputedStyle(root).getPropertyValue("--bg");
  if (!still) await veil.animate({ opacity: [0, 1] }, { duration: 220, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" }).finished;
  else veil.style.opacity = "1";

  // 2) 막 뒤에서 한 번에 교체 (개별 transition 끄기)
  root.classList.add("theming");
  root.dataset.theme = next; store.set("theme", next);
  syncThemeColor();
  await nextFrame();
  root.classList.remove("theming");
  await nextFrame();

  // 3) 막을 서서히 걷기
  veil.getAnimations().forEach(a => a.cancel());
  if (!still) await veil.animate({ opacity: [1, 0] }, { duration: 420, easing: "cubic-bezier(0,0,.2,1)", fill: "forwards" }).finished;
  veil.getAnimations().forEach(a => a.cancel());
  veil.style.opacity = "";
  themeBusy = false;
});

/* 크롬 계열에서만 굴절 필터 */
if (CFG.REFRACTION && navigator.userAgentData && navigator.userAgentData.brands.some(b => /Chrom/.test(b.brand))) {
  root.classList.add("refract");
}

/* ===== 날짜 유틸 ===== */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const WD = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];

/* ===== NEIS ===== */
async function neis(endpoint, params){
  const q = { Type: "json", ...params };
  if (CFG.KEY) Object.assign(q, { KEY: CFG.KEY, pIndex: 1, pSize: 100 });
  const res = await fetch(API + endpoint + "?" + new URLSearchParams(q));
  if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
  const j = await res.json();
  if (j.RESULT) {
    if (j.RESULT.CODE === "INFO-200") return [];
    throw new Error(j.RESULT.MESSAGE || j.RESULT.CODE);
  }
  const block = j[endpoint];
  const r = block?.[0]?.head?.[1]?.RESULT;
  if (r && r.CODE !== "INFO-000") throw new Error(r.MESSAGE);
  return block?.[1]?.row || [];
}

let schoolCodePromise = null;
function getSchoolCode(){
  if (CFG.SCHOOL_CODE) return Promise.resolve(CFG.SCHOOL_CODE);
  const cached = store.get("schoolCode");
  if (cached) return Promise.resolve(cached);
  schoolCodePromise ??= neis("schoolInfo", { ATPT_OFCDC_SC_CODE: CFG.OFFICE, SCHUL_NM: CFG.SCHOOL_NAME })
    .then(rows => {
      const hit = rows.find(r => r.SCHUL_NM === CFG.SCHOOL_NAME) || rows[0];
      if (!hit) throw new Error("학교 정보를 찾지 못했어요");
      store.set("schoolCode", hit.SD_SCHUL_CODE);
      return hit.SD_SCHUL_CODE;
    })
    .catch(e => { schoolCodePromise = null; throw e; });
  return schoolCodePromise;
}

function cleanDishes(s){
  return s.split(/<br\s*\/?>/i)
    .map(d => d.replace(/\s*\(\s*[\d.\s]+\)\s*$/, "")   // (1.2.5.)
               .replace(/(\D)[\d.]+\.$/, "$1")           // 우유2.
               .replace(/[*#]+$/, "")
               .trim())
    .filter(Boolean);
}

const cache = new Map();
function getMeals(date){
  const key = ymd(date);
  if (!cache.has(key)) {
    const p = getSchoolCode()
      .then(code => neis("mealServiceDietInfo", { ATPT_OFCDC_SC_CODE: CFG.OFFICE, SD_SCHUL_CODE: code, MLSV_YMD: key }))
      .then(rows => {
        const out = {};
        for (const r of rows) out[r.MMEAL_SC_NM] = cleanDishes(r.DDISH_NM || "");
        return out;
      })
      .catch(e => { cache.delete(key); throw e; });
    cache.set(key, p);
  }
  return cache.get(key);
}

/* ===== 화면 ===== */
const $date = document.getElementById("date");
const $wd = document.getElementById("weekday");
const $stack = document.getElementById("stack");
const $today = document.getElementById("today");
let current = startOfDay(new Date());

function currentMeal(){
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  if (m < 9 * 60) return "조식";
  if (m < 14 * 60) return "중식";
  return "석식";
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

let openMeal = null;          // 펼친 끼니 (없으면 셋 다 같은 크기)
let openTouched = false;      // 사용자가 직접 고른 적 있는지

function cardShell(name, isNow, inner, summary){
  const toggle = MEALS.includes(name);
  const attrs = toggle ? ` role="button" tabindex="0" aria-expanded="false"` : "";
  return `<article class="meal glass${isNow ? " now" : ""}" data-meal="${name}"${attrs}>
    <div class="meal-head"><h2>${name}</h2>${toggle ? `<span class="summary">${esc(summary || "")}</span>` : ""}${isNow ? '<span class="chip">지금</span>' : ""}</div>
    <div class="content">${inner}</div></article>`;
}

function applyOpen(){
  const cards = [...$stack.querySelectorAll('.meal[role="button"]')];
  cards.forEach(c => {
    const isOpen = openMeal === c.dataset.meal;
    c.classList.toggle("open", isOpen);
    c.classList.toggle("mini", !!openMeal && !isOpen);
    c.setAttribute("aria-expanded", String(isOpen));
    if (!isOpen) c.querySelector(".content").scrollTop = 0;
  });
  invalidateGlass();
}

function toggleMeal(name){
  openTouched = true;
  openMeal = openMeal === name ? null : name;
  applyOpen();
}

function renderHeader(){
  const isToday = ymd(current) === ymd(new Date());
  const diff = Math.round((current - startOfDay(new Date())) / 864e5);
  const rel = isToday ? "<b>오늘</b> " : diff === 1 ? "<b>내일</b> " : diff === -1 ? "<b>어제</b> " : "";
  $date.textContent = `${current.getMonth()+1}월 ${current.getDate()}일`;
  $wd.innerHTML = rel + WD[current.getDay()];
  $today.hidden = isToday;
  document.title = `${current.getMonth()+1}/${current.getDate()} 급식`;
}

async function render(){
  renderHeader();
  const isToday = ymd(current) === ymd(new Date());
  const nowMeal = isToday ? currentMeal() : null;
  const target = ymd(current);

  if (!openTouched) openMeal = nowMeal;
  $stack.innerHTML = MEALS.map(m => cardShell(m, m === nowMeal,
    '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>', "불러오는 중")).join("");
  applyOpen();

  try {
    const data = await getMeals(current);
    if (target !== ymd(current)) return;
    const any = MEALS.some(m => data[m]?.length);
    if (!any) {
      $stack.innerHTML = cardShell("급식 없음", false,
        '<p class="note">이 날은 등록된 급식이 없어요. 주말이나 방학일 수 있어요.</p>');
    } else {
      $stack.innerHTML = MEALS.map(m => {
        const list = data[m];
        const inner = list?.length
          ? `<ul class="dishes">${list.map(d => `<li>${esc(d)}</li>`).join("")}</ul>`
          : '<p class="note">이 끼니는 등록된 메뉴가 없어요.</p>';
        const summary = list?.length ? (list.length > 1 ? `${list[0]} 외 ${list.length - 1}개` : list[0]) : "메뉴 없음";
        return cardShell(m, m === nowMeal, inner, summary);
      }).join("");
      applyOpen();
    }
    getMeals(addDays(current, 1)).catch(() => {});
    getMeals(addDays(current, -1)).catch(() => {});
  } catch (e) {
    if (target !== ymd(current)) return;
    $stack.innerHTML = cardShell("불러오기 실패", false,
      `<p class="note">급식 정보를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.<br><small>${esc(String(e.message || e))}</small><br><button id="retry">다시 불러오기</button></p>`);
    document.getElementById("retry").onclick = render;
  }
}

/* ===== 날짜 이동 애니메이션 ===== */
const SPRING = "transform .55s cubic-bezier(.34,1.56,.64,1), opacity .35s ease";
let busy = false;
async function go(delta){
  if (busy) return; busy = true;
  const out = delta > 0 ? -1 : 1;
  $stack.style.transition = "transform .22s ease-in, opacity .22s ease-in";
  $stack.style.transform = `translateX(${out * 36}%)`;
  $stack.style.opacity = "0";
  $date.style.opacity = "0"; $date.style.transform = `translateX(${out * 14}px)`;
  await new Promise(r => setTimeout(r, 200));
  current = addDays(current, delta);
  const p = render();
  $stack.style.transition = "none";
  $stack.style.transform = `translateX(${-out * 36}%)`;
  $date.style.transition = "none"; $date.style.transform = `translateX(${-out * 14}px)`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $stack.style.transition = SPRING; $stack.style.transform = ""; $stack.style.opacity = "";
    $date.style.transition = ""; $date.style.transform = ""; $date.style.opacity = "";
  }));
  await p; busy = false;
}
function goToday(){
  const diff = Math.round((startOfDay(new Date()) - current) / 864e5);
  if (diff) go(diff);
}

document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
$today.onclick = goToday;
$date.onclick = goToday;
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});

/* 끼니 카드 탭 → 펼치기/접기 */
let suppressClick = false;
$stack.addEventListener("click", e => {
  if (suppressClick || e.target.closest("button")) return;
  const card = e.target.closest('.meal[role="button"]');
  if (card) toggleMeal(card.dataset.meal);
});
$stack.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest('.meal[role="button"]');
  if (card) { e.preventDefault(); toggleMeal(card.dataset.meal); }
});
$stack.addEventListener("transitionend", e => { if (e.propertyName === "flex-grow" || e.propertyName === "flex") invalidateGlass(); });

/* 스와이프 (transform만, 프레임당 1회) */
let sx = 0, sy = 0, dx = 0, tracking = false, horiz = null, dragRaf = null;
$stack.addEventListener("pointerdown", e => {
  if (busy || e.pointerType === "mouse" && e.button !== 0) return;
  tracking = true; horiz = null; sx = e.clientX; sy = e.clientY; dx = 0;
}, { passive: true });
addEventListener("pointermove", e => {
  if (!tracking) return;
  const mx = e.clientX - sx, my = e.clientY - sy;
  if (horiz === null && Math.hypot(mx, my) > 8) {
    horiz = Math.abs(mx) > Math.abs(my);
    if (horiz) { $stack.classList.add("dragging"); $stack.style.transition = "none"; }
  }
  if (!horiz) return;
  dx = mx;
  if (!dragRaf) dragRaf = requestAnimationFrame(() => {
    dragRaf = null;
    $stack.style.transform = `translate3d(${dx * 0.55}px,0,0)`;
  });
}, { passive: true });
function endSwipe(){
  if (!tracking) return; tracking = false;
  if (dragRaf) { cancelAnimationFrame(dragRaf); dragRaf = null; }
  $stack.classList.remove("dragging");
  if (horiz) { suppressClick = true; setTimeout(() => suppressClick = false, 60); }
  if (horiz && Math.abs(dx) > 70) { go(dx < 0 ? 1 : -1); }
  else if (horiz) { $stack.style.transition = SPRING; $stack.style.transform = ""; }
}
addEventListener("pointerup", endSwipe, { passive: true });
addEventListener("pointercancel", endSwipe, { passive: true });

/* ===== 애플펜슬 호버 / 마우스: 빛이 액체처럼 따라옴 =====
   손가락 터치에서는 아예 동작하지 않음 (폰에서는 비용 0) */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hover = { x: 0, y: 0, on: false };
const glassState = new WeakMap();
let hoverRaf = null, hoverIdle = null, glassCache = null;

function invalidateGlass(){ glassCache = null; }
addEventListener("resize", invalidateGlass, { passive: true });
addEventListener("scroll", invalidateGlass, { passive: true });
new MutationObserver(invalidateGlass).observe($stack, { childList: true });
function glassList(){
  if (!glassCache) glassCache = [...document.querySelectorAll(".glass")].map(el => ({ el, r: el.getBoundingClientRect() }));
  return glassCache;
}
function startHover(){ if (!hoverRaf) hoverRaf = requestAnimationFrame(hoverTick); }

addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || tracking) return;
  hover.x = e.clientX; hover.y = e.clientY; hover.on = true;
  clearTimeout(hoverIdle);
  hoverIdle = setTimeout(() => { hover.on = false; startHover(); }, 1200);
  startHover();
}, { passive: true });
document.addEventListener("pointerout", e => {
  if (!e.relatedTarget && e.pointerType !== "touch") { hover.on = false; startHover(); }
});

function hoverTick(){
  hoverRaf = null;
  let moving = false;
  const k = 0.16; // 낮을수록 더 끈적하게 따라옴
  for (const { el, r } of glassList()) {
    let s = glassState.get(el);
    if (!s) { s = { mx: r.width * .3, my: 0, glow: 0, rx: 0, ry: 0 }; glassState.set(el, s); }

    const px = hover.x - r.left, py = hover.y - r.top;
    const ox = Math.max(-px, 0, px - r.width), oy = Math.max(-py, 0, py - r.height);
    const dist = Math.hypot(ox, oy);
    const tGlow = hover.on ? Math.max(0, 1 - dist / 110) : 0;
    // 멀리 있고 이미 꺼진 카드는 건드리지 않음
    if (tGlow === 0 && s.glow < 0.002 && Math.abs(s.rx) + Math.abs(s.ry) < 0.02) {
      if (s.glow !== 0) { s.glow = 0; el.classList.remove("lit"); el.style.setProperty("--glow", "0"); }
      continue;
    }
    const tilt = hover.on && dist === 0 && !reduceMotion && el.classList.contains("meal");
    const tRy = tilt ? (px / r.width - .5) * 7 : 0;
    const tRx = tilt ? -(py / r.height - .5) * 7 : 0;

    if (hover.on) { s.mx += (px - s.mx) * k; s.my += (py - s.my) * k; }
    s.glow += (tGlow - s.glow) * k;
    s.rx += (tRx - s.rx) * k; s.ry += (tRy - s.ry) * k;
    moving = true;

    el.style.setProperty("--mx", `${s.mx.toFixed(1)}px`);
    el.style.setProperty("--my", `${s.my.toFixed(1)}px`);
    el.style.setProperty("--glow", s.glow.toFixed(3));
    el.classList.toggle("lit", s.glow > 0.01);
    if (el.classList.contains("meal")) {
      el.style.setProperty("--rx", `${s.rx.toFixed(2)}deg`);
      el.style.setProperty("--ry", `${s.ry.toFixed(2)}deg`);
      el.classList.toggle("tilting", Math.abs(s.rx) + Math.abs(s.ry) > 0.05);
    }
  }
  if (moving) startHover();
}

/* 앱으로 돌아왔을 때 날짜/끼니 갱신 */
let lastDay = ymd(new Date());
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const d = ymd(new Date());
  if (d !== lastDay && ymd(current) === lastDay) { current = startOfDay(new Date()); }
  lastDay = d; render();
});

render();
</script>
</body>
</html>
